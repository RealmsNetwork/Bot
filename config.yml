# RealmsNetwork Bot Configuration
# Edit these values before starting the bot.

# Your Discord bot token from the developer portal.
token: "YOUR_BOT_TOKEN_HERE"

# The ID of your server (guild). Right-click the server icon and copy ID.
guildId: "YOUR_GUILD_ID_HERE"

# Custom branding used in all embeds and messages.
branding:
  serverName: "RealmsNetwork"
  supportUrl: "https://dsc.gg/realmsnetworksupport"
  embedColor: "#FF0000"          # Hex color for warning embeds (e.g., #FF0000 for red)
  logColor: "#2B2D31"            # Hex color for log embeds

# Global staff role - shared across all modules.
staff:
  # Role ID of your trusted staff team.
  roleId: "YOUR_STAFF_ROLE_ID_HERE"

# Honeypot module settings.
honeypot:
  # The channel where no one should ever send messages.
  channelId: "YOUR_HONEYPOT_CHANNEL_ID_HERE"

  # Channel where staff logs are sent (optional).
  logChannelId: "YOUR_LOG_CHANNEL_ID_HERE"

  # What to do when someone posts here:
  #   ban      - permanently remove the user
  #   kick     - remove the user (they can rejoin)
  #   timeout  - restrict for a while (see timeoutDuration below)
  #   none     - just log and delete the message, no punishment
  punishment: "ban"

  # Ignore bots and webhooks (recommended true).
  ignoreBots: true
  ignoreWebhooks: true

  # Whether to ignore members with the global staff role.
  # If true, staff are immune to this module.
  # If false, staff will be punished like normal users.
  ignoreStaff: true

  # Send a direct message to the user before punishing them.
  dmBeforePunishment: true

  # Self-healing: if the warning embed gets deleted or changed, recreate it.
  recreateWarning: true

  # On every startup, delete all old messages in the honeypot channel.
  purgeOnStartup: true

  # Immediately delete the message that triggered the honeypot.
  deleteTriggerMessage: true

  # How long to timeout a user (in milliseconds). Only used if punishment = timeout.
  timeoutDuration: 86400000

  # The warning embed that will be shown in the honeypot channel.
  warningEmbed:
    title: "<a:exclamation:1426253027693559991> WARNING <a:exclamation:1426253027693559991>"

    # You can set a custom color here (e.g., "#FF0000"), or leave it null to use branding.embedColor.
    color: null

    # The author line at the top of the embed.
    author:
      # If left empty, will use branding.serverName + " Security System".
      name: null

    # Main text of the warning. Use | to keep line breaks.
    # Placeholders: {serverName} and {supportUrl} will be replaced.
    description: |
      # Honeypot Security Channel

      This channel is continuously monitored by {serverName}'s automated security system.

      Any attempt to send messages, commands, images, stickers, GIFs, emojis, files, embeds, polls, or any other content will immediately trigger the honeypot.

      Consequences:
      - Permanent ban.
      - Incident logged for staff review.
      - No exceptions.

      Do not interact with this channel for any reason.

      Appeal: {supportUrl}

    footer:
      # If left empty, uses "{serverName} • Automated Security".
      text: null

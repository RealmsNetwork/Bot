enabled: false
advanced: false

dependencies:
  - "@discordjs/voice@0.19.2"
  - "@discordjs/opus@0.10.0"
  - "play-dl@1.9.7"
  - "yt-dlp-wrap-plus@2.5.0"
  - "ffmpeg-static@5.3.0"
  - "genius-lyrics@4.4.7"
  - "node-edge-tts@1.2.10"

music:
  enabled: true
  searchLimit: 5
  panelSearchLimit: 25
  maxQueueSize: 100
  maxPlaylistSize: 200
  maxTrackLengthSeconds: 7200
  leaveWhenEmpty: true
  leaveDelaySeconds: 180
  defaultVolume: 100
  maxVolume: 150
  crossfadeSeconds: 0
  voteSkipThreshold: 50
  autoplay: false
  announceNowPlaying: true
  djRoleId: ""
  restrictToRequester: false
  sources:
    youtube: true
    soundcloud: true
    spotifySearch: true
    appleMusicSearch: true
    deezerSearch: true
    tidalSearch: true
    youtubeMusic: true
    bandcamp: true

tts:
  enabled: true
  provider: edge
  defaultVoice: en-US-AriaNeural
  defaultLanguage: en-US
  panelEditable: true
  autoTts: false
  maxCharacters: 500
  maxQueueSize: 20
  maxRate: 100
  outputFormat: audio-24khz-96kbitrate-mono-mp3
  timeoutMs: 15000
  maxAudioBytes: 8388608
  maxRemoteBytes: 8388608
  maxVolume: 100
  cooldownSeconds: 3
  allowUserVoiceSelection: true
  allowPublicAudio: true
  autoTtsAnyTextChannel: false

temporaryVoice:
  enabled: true
  triggerChannelId: ""
  categoryId: ""
  nameTemplate: "{user}'s Room"
  bitrate: 64000
  userLimit: 0
  autoDeleteEmpty: true
  ownerOnlyControl: true
  allowOwnerTransfer: true
  allowOwnerKick: true
  allowOwnerMute: true
  allowOwnerDeafen: true
  allowOwnerRename: true
  allowOwnerLimit: true
  allowOwnerBitrate: true
  allowOwnerLock: true
  allowOwnerUnlock: true
  allowOwnerHide: true
  allowOwnerUnhide: true
  allowOwnerClaim: true
  allowOwnerPanel: true
  allowOwnerBan: true
  autoTransferOnOwnerLeave: true
  ownerLeaveGraceSeconds: 300
  panelAllowTtsControl: true
  panelAllowUserAccess: true
  panelAllowRoleAccess: true
  panelAccessCanControl: true
  allowOwnerTts: true
  panelEnabled: true
  panelSuffix: "-panel"
  panelAutoPin: true
  panelEphemeral: true
  panelTimeoutSeconds: 300
  defaultLocked: false
  defaultHidden: false
  syncPermissions: true
  maxBitrate: 384000
  cleanupIntervalSeconds: 10
  emptyRoomGraceSeconds: 300
  recoveryGraceSeconds: 600

branding:
  panelTitle: "Voice Control"
  panelDescription: "Manage your temporary voice room."
  musicTitle: "Music"
  ttsTitle: "Text to Speech"

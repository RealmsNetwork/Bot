tts:
  provider: edge
  panelEditable: true
  autoTts: false
  maxCharacters: 500
  maxQueueSize: 20
  maxRate: 100
  outputFormat: audio-24khz-96kbitrate-mono-mp3
  timeoutMs: 15000
  maxAudioBytes: 8388608
  maxRemoteBytes: 8388608
  maxVolume: 100
  cooldownSeconds: 3
temporaryVoice:
  panelEnabled: true
  panelSuffix: "-panel"
  panelAutoPin: true
  panelAllowUserAccess: true
  panelAllowRoleAccess: true
  panelAccessCanControl: true
  allowOwnerTts: true
  allowOwnerBan: true
  panelAllowTtsControl: true
  autoTransferOnOwnerLeave: true

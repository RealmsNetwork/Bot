# RealmsNetwork Bot V2
# Root config: global runtime only. Every module owns its own config.yml.
# All feature modules are OFF by default.
version: 3

guildId: "YOUR_GUILD_ID_HERE"

branding:
  serverName: "RealmsNetwork"
  embedColor: "#8b5cf6"
  logColor: "#2B2D31"
  footer: "RealmsNetwork"
  supportUrl: "https://dsc.gg/realmsnetworksupport"
  permissionDenied: "You do not have permission to use this command."
  errorMessage: "Something went wrong while running that command."
  customBranding: true

runtime:
  environment: production
  gracefulShutdown: true
  crashProtection: true
  maxListeners: 50
  cacheSize: 1000
  telemetry: false

commands:
  autoRefresh: true
  autoDeploy: true
  refreshIntervalMs: 5000
  guildOnly: true
  clearRemoved: true
  syncOnReady: true

permissions:
  ownerBypass: true
  managerRoles: []
  adminRoles: []
  moderatorRoles: []
  globalDenyUsers: []
  globalDenyRoles: []
  globalDenyChannels: []
  commands: {}

sharding:
  enabled: false
  totalShards: auto
  shardList: auto
  respawn: true
  maxConcurrency: auto

# One selected persistence provider. Driver packages are loaded only when enabled.
database:
  enabled: false
  primary: none
  fallbackToLocal: true
  mysql:
    url: ""
    connectionLimit: 5
  postgres:
    url: ""
    maxConnections: 5
  mongodb:
    url: ""
    database: "realmsbot"
  redis:
    url: "redis://127.0.0.1:6379"
    keyPrefix: "realmsbot:"

migration:
  enabled: true
  backupLegacyConfig: true
  keepLegacyAliases: true

customModules:
  enabled: true
  directory: custom-modules
  watch: true
  allowJavaScript: true
  allowYaml: true

ai:
  enabled: false
  provider: ollama
  model: llama3.2
  baseUrl: http://127.0.0.1:11434/v1
  apiKeyEnv: OPENAI_API_KEY
  temperature: 0.7
  maxTokens: 1200
  maxInputLength: 6000
  cooldownSeconds: 3

# New canonical module names. Configure each module in modules/<name>/config.yml.
aiLegacy: { enabled: false }
security: { enabled: false }
moderation: { enabled: false }
automod: { enabled: false }
logging: { enabled: false }
welcome: { enabled: false }
autorole: { enabled: false }
community: { enabled: false }
economy: { enabled: false }
leveling: { enabled: false }
giveaways: { enabled: false }
tickets: { enabled: false }
roles: { enabled: false }
fun: { enabled: false }
utility: { enabled: false }
extended: { enabled: false }
server: { enabled: false }
notifications: { enabled: false }
reminders: { enabled: false }
verification: { enabled: false }
starboard: { enabled: false }
automation: { enabled: false }
developer: { enabled: false }
countryballs: { enabled: false }
feeds: { enabled: false }
forms: { enabled: false }
afk: { enabled: false }
tags: { enabled: false }
autoresponder: { enabled: false }
messageEmbedder: { enabled: false }
highlights: { enabled: false }
voiceLink: { enabled: false }
music: { enabled: false }

# Kept as compatibility switches for older V1 configs.
aichat: { enabled: false }
honeypot: { enabled: false }

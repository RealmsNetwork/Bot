# RealmsNetwork Bot v2 configuration
# Feature packs are deliberately OFF unless explicitly enabled.
version: 2.0

guildId: "YOUR_GUILD_ID_HERE"

branding:
  serverName: "RealmsNetwork"
  supportUrl: "https://dsc.gg/realmsnetworksupport"
  embedColor: "#8b5cf6"
  logColor: "#2B2D31"

commandDeployment:
  autoDeploy: false
  guildOnly: true

sharding:
  enabled: false
  totalShards: auto
  shardList: auto
  respawn: true

database:
  enabled: false
  primary: none
  mysql:
    url: ""
    connectionLimit: 5
  postgres:
    url: ""
    maxConnections: 5
  mongodb:
    url: ""
    database: "realmsbot"
  redis:
    url: "redis://127.0.0.1:6379"

staff:
  roleId: "YOUR_STAFF_ROLE_ID_HERE"

developer:
  enabled: false
  ownerId: "YOUR_DISCORD_USER_ID_HERE"

utility: { enabled: false }
moderation: { enabled: false }
community: { enabled: false, suggestionChannelId: "", reportChannelId: "" }
server: { enabled: false }
economy: { enabled: false }
leveling: { enabled: false }
giveaways: { enabled: false }
tickets: { enabled: false }
roles: { enabled: false }
fun: { enabled: false }
logging:
  enabled: false
  channelId: ""
welcome:
  enabled: false
  channelId: ""
  message: "Welcome {user} to {server}!"
automod:
  enabled: false
  logChannelId: ""
  deleteMessage: true
  timeoutMinutes: 0
  bannedWords: []
automation:
  enabled: false
  responses: {}

honeypot:
  enabled: false
  channelId: ""
  logChannelId: ""
  punishment: "ban"
  ignoreBots: true
  ignoreWebhooks: true
  ignoreStaff: true
  dmBeforePunishment: true
  recreateWarning: true
  purgeOnStartup: true
  deleteTriggerMessage: true
  timeoutDuration: 86400000
  warningEmbed:
    title: "WARNING"
    color: null
    author:
      name: null
    description: "This channel is monitored by {serverName}.\n\nAppeal: {supportUrl}"
    footer:
      text: null

aichat:
  enabled: false
  channelId: ""
  maxInputLength: 2000
  maxAttachments: 4
  cooldownSeconds: 5
  fallbackMessage: "I couldn't generate a response. Please try again."
  errorMessage: "Something went wrong while generating a response."
  model: "gemini-3.1-flash-lite"

music: { enabled: false }
autorole: { enabled: false }
starboard: { enabled: false }
verification: { enabled: false }
suggestions: { enabled: false }
serverstats: { enabled: false }
statuspage: { enabled: false }
reminders: { enabled: false }
notifications: { enabled: false }
audit: { enabled: false }
webhooks: { enabled: false }
integrations: { enabled: false }
feeds: { enabled: false }

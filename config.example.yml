# RealmsNetwork Bot v0.1 production/development configuration
# Secrets belong in .env. Module behavior belongs in modules/<name>/config.yml.
version: 4
release: "0.1.0"

guildId: "YOUR_GUILD_ID_HERE"

branding:
  serverName: "RealmsNetwork"
  botName: "RealmsNetwork Bot"
  embedColor: "#8b5cf6"
  logColor: "#2B2D31"
  footer: "RealmsNetwork"
  supportUrl: "https://dsc.gg/realmsnetwork"
  iconUrl: ""
  logoUrl: ""
  customBranding: true
  showModuleNames: false
  permissionDenied: "You do not have permission to use this command."
  errorMessage: "Something went wrong while running that command."
  successMessage: "Done."

runtime:
  environment: production
  gracefulShutdown: true
  crashProtection: true
  cacheSize: 2000
  maxListeners: 200
  healthChecks: true
  diagnostics: true
  logLevel: info

prefix:
  enabled: false
  prefixes: ["!"]
  mentionPrefix: true
  errorMessage: "Command failed. Check the syntax and try again."
  includeBrandPrefixInMessages: true

commands:
  autoRefresh: true
  autoDeploy: true
  refreshIntervalMs: 5000
  guildOnly: true
  clearRemoved: true
  syncOnReady: true
  defaultCooldownSeconds: 0

permissions:
  ownerBypass: true
  managerRoles: []
  adminRoles: []
  moderatorRoles: []
  globalDenyUsers: []
  globalDenyRoles: []
  globalDenyChannels: []
  commands: {}

sharding:
  enabled: false
  autoDetect: false
  totalShards: 1
  shardList: auto
  respawn: true
  maxConcurrency: auto

database:
  enabled: true
  primary: sqlite
  fallbackToLocal: true
  sqlite:
    path: data/realmsbot.sqlite
    journalMode: WAL
  mysql: { url: "", connectionLimit: 5 }
  postgres: { url: "", maxConnections: 5 }
  mongodb: { url: "", database: "realmsbot" }
  redis: { url: "redis://127.0.0.1:6379", keyPrefix: "realmsbot:" }

migration:
  enabled: true
  backupLegacyConfig: true
  keepLegacyAliases: true
  migrateModuleConfigs: true

customModules:
  enabled: true
  directory: custom-modules
  watch: true
  allowJavaScript: true
  allowYaml: true
  allowInlineJS: false
  maxActionsPerRun: 250
  maxLoopIterations: 100
  maxWaitMs: 30000

adminPanel:
  enabled: false
  host: 127.0.0.1
  port: 8787
  tokenEnv: DASHBOARD_TOKEN
  public: false
  readOnly: true
  allowReload: true
  allowModuleToggle: true

ai:
  enabled: false
  provider: ollama
  model: llama3.2
  baseUrl: http://127.0.0.1:11434/v1
  apiKeyEnv: OPENAI_API_KEY
  temperature: 0.7
  maxTokens: 1200
  maxInputLength: 6000
  cooldownSeconds: 3
  retryDelayMs: 500
  fallbackProviders: [groq, openai_compatible]

# Every optional feature is disabled until its module config enables it.
platform: { enabled: false }
aiLegacy: { enabled: false }
security: { enabled: false }
moderation: { enabled: false }
automod: { enabled: false }
logging: { enabled: false }
welcome: { enabled: false }
autorole: { enabled: false }
community: { enabled: false }
economy: { enabled: false }
leveling: { enabled: false }
giveaways: { enabled: false }
tickets: { enabled: false }
roles: { enabled: false }
fun: { enabled: false }
utility: { enabled: false }
extended: { enabled: false }
server: { enabled: false }
notifications: { enabled: false }
reminders: { enabled: false }
verification: { enabled: false }
starboard: { enabled: false }
automation: { enabled: false }
developer: { enabled: false }
countryballs: { enabled: false }
engagement: { enabled: false }
feeds: { enabled: false }
forms: { enabled: false }
afk: { enabled: false }
tags: { enabled: false }
autoresponder: { enabled: false }
messageEmbedder: { enabled: false }
highlights: { enabled: false }
voiceLink: { enabled: false }
voice: { enabled: false }
dashboard: { enabled: false }

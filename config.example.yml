# RealmsNetwork Bot V3 root configuration
# Global runtime only. Module behavior belongs in modules/<name>/config.yml.
# All feature modules are OFF by default except the tiny platform/help pack.
version: 3

guildId: "YOUR_GUILD_ID_HERE"

branding:
  serverName: "RealmsNetwork"
  embedColor: "#8b5cf6"
  logColor: "#2B2D31"
  footer: "RealmsNetwork"
  supportUrl: "https://dsc.gg/realmsnetworksupport"
  customBranding: true

runtime:
  environment: production
  gracefulShutdown: true
  crashProtection: true
  maxListeners: 100
  cacheSize: 1000

commands:
  autoRefresh: true
  autoDeploy: true
  refreshIntervalMs: 5000
  guildOnly: true
  clearRemoved: true
  syncOnReady: true
  defaultCooldownSeconds: 0

permissions:
  ownerBypass: true
  managerRoles: []
  adminRoles: []
  moderatorRoles: []
  globalDenyUsers: []
  globalDenyRoles: []
  globalDenyChannels: []
  commands: {}

sharding:
  enabled: false
  totalShards: auto
  shardList: auto
  respawn: true
  maxConcurrency: auto

database:
  enabled: false
  primary: none
  fallbackToLocal: true
  mysql: { url: "", connectionLimit: 5 }
  postgres: { url: "", maxConnections: 5 }
  mongodb: { url: "", database: "realmsbot" }
  redis: { url: "redis://127.0.0.1:6379", keyPrefix: "realmsbot:" }

migration:
  enabled: true
  backupLegacyConfig: true
  keepLegacyAliases: true
  migrateModuleConfigs: true

customModules:
  enabled: true
  directory: custom-modules
  watch: true
  allowJavaScript: true
  allowYaml: true
  allowInlineJS: false
  maxActionsPerRun: 250
  maxLoopIterations: 100
  maxWaitMs: 30000

ai:
  enabled: false
  provider: ollama
  model: llama3.2
  baseUrl: http://127.0.0.1:11434/v1
  apiKeyEnv: OPENAI_API_KEY
  temperature: 0.7
  maxTokens: 1200
  maxInputLength: 6000
  cooldownSeconds: 3
  retryDelayMs: 500
  fallbackProviders: [groq, openai_compatible]
  providers:
    ollama: { baseUrl: http://127.0.0.1:11434/v1, model: llama3.2 }
    lmstudio: { baseUrl: http://127.0.0.1:1234/v1, model: local-model }
    openai: { baseUrl: https://api.openai.com/v1, model: gpt-5 }
    groq: { baseUrl: https://api.groq.com/openai/v1, model: openai/gpt-oss-120b }
    mistral: { baseUrl: https://api.mistral.ai/v1, model: mistral-large-latest }
    deepseek: { baseUrl: https://api.deepseek.com/v1, model: deepseek-chat }
    xai: { baseUrl: https://api.x.ai/v1, model: grok-4 }
    together: { baseUrl: https://api.together.xyz/v1, model: meta-llama/Llama-3.3-70B-Instruct-Turbo }
    openrouter: { baseUrl: https://openrouter.ai/api/v1, model: openai/gpt-4o-mini }
    perplexity: { baseUrl: https://api.perplexity.ai, model: sonar }
    cohere: { baseUrl: https://api.cohere.com/compatibility/v1, model: command-a-03-2025 }
    huggingface: { baseUrl: https://router.huggingface.co/v1, model: meta-llama/Llama-3.3-70B-Instruct }
    anthropic: { baseUrl: https://api.anthropic.com, model: claude-sonnet-4-5 }
    gemini: { model: gemini-2.5-flash }
    openai_compatible: { baseUrl: http://127.0.0.1:1234/v1, model: local-model, apiKeyEnv: OPENAI_COMPATIBLE_API_KEY }

# First-party module switches. Detailed settings live beside each module.
platform: { enabled: true }
ai: { enabled: false }
aiLegacy: { enabled: false }
security: { enabled: false }
moderation: { enabled: false }
automod: { enabled: false }
logging: { enabled: false }
welcome: { enabled: false }
autorole: { enabled: false }
community: { enabled: false }
economy: { enabled: false }
leveling: { enabled: false }
giveaways: { enabled: false }
tickets: { enabled: false }
roles: { enabled: false }
fun: { enabled: false }
utility: { enabled: false }
extended: { enabled: false }
server: { enabled: false }
notifications: { enabled: false }
reminders: { enabled: false }
verification: { enabled: false }
starboard: { enabled: false }
automation: { enabled: false }
developer: { enabled: false }
countryballs: { enabled: false }
engagement: { enabled: false }
feeds: { enabled: false }
forms: { enabled: false }
af k: { enabled: false }
tags: { enabled: false }
autoresponder: { enabled: false }
messageEmbedder: { enabled: false }
highlights: { enabled: false }
voiceLink: { enabled: false }
music: { enabled: false }

name: Bot QC

on:
  push:
  pull_request:

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Load all YAML
        run: node -e "const fs=require('fs'),yaml=require('js-yaml'); const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(x=>x.isDirectory()?walk(require('path').join(d,x.name)):[require('path').join(d,x.name)]); for(const f of walk('.').filter(x=>x.endsWith('.yml')||x.endsWith('.yaml'))){yaml.load(fs.readFileSync(f,'utf8')); console.log('YAML ok',f)}"
      - name: Validate V3 config
        run: node -e "const fs=require('fs'),yaml=require('js-yaml'); const x=yaml.load(fs.readFileSync('config.example.yml','utf8')); if(!x || x.version!==3 || x.commands.autoRefresh!==true) process.exit(1); console.log('config v3 ok')"
      - name: Validate custom module example
        run: node -e "const fs=require('fs'),yaml=require('js-yaml'); const x=yaml.load(fs.readFileSync('custom-modules/example/module.yml','utf8')); if(!x || !x.commands?.length) process.exit(1); console.log('custom module DSL ok')"
